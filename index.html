<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Corporate Access</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="#" class="logo">Corporate Access</a>
      <nav class="nav-links">
        <a href="#" class="nav-link">Dashboard</a>
        <a href="#" class="nav-link">Security</a>
      </nav>
    </div>
  </header>

  <main class="login-page">
    <div class="container">
      <section class="login-card">
        <h2>Sign In</h2>
        <p class="subtitle">Access your corporate dashboard</p>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
            
            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" class="remember-input"> Remember me
                <span class="checkmark"></span>
              </label>
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        
        <div class="divider">
          <span>or continue with</span>
        </div>
        
        <div class="social-buttons">
          <button type="button" class="btn-social">Google</button>
          <button type="button" class="btn-social">Microsoft</button>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
